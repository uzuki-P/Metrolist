# Metrolist+: build the signed release APK on a GitHub-hosted runner.
# Signing uses the keystore that signs local builds (~/.android/debug.keystore),
# stored as repo secrets, so CI APKs install as updates over local ones.
# ci-fetch.timer (dotconfig) downloads the artifact into _apk/.
name: android-apk

on:
  push:
    branches: [v14, main]
    paths-ignore: ["**.md", "docs/**", "fastlane/**"]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare CI Gradle
        uses: ./.github/actions/prepare-ci-gradle
        with:
          cache-scope: plus-android-release
          persist-configuration-cache: 'false'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      # Without the keystore, Gradle signs with the runner's own debug key and the APK
      # would not install over the existing app.
      - name: Write signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - uses: extractions/setup-just@v3

      - name: Build and stage APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          JAVA_HOME_25: ${{ env.JAVA_HOME }}
        run: just stage-apk

      - uses: actions/upload-artifact@v4
        with:
          name: metrolist-plus-apk
          path: _apk/*.apk
          if-no-files-found: error
          retention-days: 7
