# Metrolist+: build the Windows x64 portable package on a GitHub-hosted runner.
# Upstream's packaging produces a ZIP; unzip it anywhere and run Metrolist.exe.
# ci-fetch.timer (dotconfig) downloads the artifact into _apk/.
name: windows-exe

on:
  push:
    branches: [v14, main]
    paths-ignore: ["**.md", "docs/**", "fastlane/**", "androidApp/**"]
  workflow_dispatch:

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set timezone
        run: tzutil /s "SE Asia Standard Time"

      - name: Prepare CI Gradle
        uses: ./.github/actions/prepare-ci-gradle
        with:
          cache-scope: plus-desktop-windows
          persist-configuration-cache: 'false'

      - name: Generate installer icons
        uses: ./.github/actions/generate-icons

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: metro-wv2-helper/global.json

      - name: Build Windows login helper
        shell: pwsh
        working-directory: metro-wv2-helper
        run: |
          $output = "../desktopApp/src/desktopMain/resources/windows"
          dotnet publish "metro-wv2-helper.csproj" --configuration Release --runtime win-x64 --self-contained true --output $output -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -p:PublishReadyToRun=true
          if ($LASTEXITCODE -ne 0) { throw "Windows login helper build failed with exit code $LASTEXITCODE" }

      - name: Build and stage the portable package
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :desktopApp:assembleWindowsRelease -Pmetrolist.desktop.arch=x86_64 --no-daemon --no-configuration-cache
          version=$(sed -n 's/^appVersion=//p' gradle.properties | tr -d '\r')
          bash scripts/stage-artifact dist/Metrolist-Desktop-Windows.zip metrolist-plus-windows "$version" _apk

      - uses: actions/upload-artifact@v4
        with:
          name: metrolist-plus-windows
          path: _apk/*.zip
          if-no-files-found: error
          retention-days: 7
